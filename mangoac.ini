
#*********** Tabla hash ****************

# UsarTablaHash
# Activa o desactiva el uso de la tabla hash.
# El valor (1) activa el uso de la tabla hash.
# El valor (0) desactiva el uso de la tabla hash.
UsarTablaHash 1

# HashMB es el presupuesto de memoria solicitado para la tabla de transposición.
# El motor usa el mayor número de entradas potencia de dos que cabe en ese
# presupuesto. En 64 bits admite de 1 a 8192 MB; el valor real se muestra al
# arrancar. Una GUI UCI puede sobrescribirlo con la opción estándar Hash.
HashMB 256

# Compatibilidad con configuraciones antiguas: TamanioTablaHash 1..9.
# Solo se usa cuando HashMB no está presente.
# TamanioTablaHash 5

#**************** Libro de aperturas ********************
# UsarLibroAperturas
# Activa o desactiva el uso del libro de aperturas.
# El valor (1) activa el uso del libro de aperturas.
# El valor (0) desactiva el uso del libro de aperturas.
UsarLibroAperturas 1

# RutaLibroPolyglot <ruta relativa o absoluta al libro de aperturas Polyglot>
RutaLibroPolyglot polyglotbooks/mangoac-book.bin

# Máximo permitido para cargar el libro completo en RAM.
MaxLibroPolyglotMB 64

#**************** Base de datos de finales ********************
# UsarTablaFinalesNalimov
# Activa o desactiva el uso de las tablas de finales Nalimov.
# El valor (1) activa el uso de las tablas de finales Nalimov.
# El valor (0) desactiva el uso de las tablas de finales Nalimov.
UsarTablaFinalesNalimov 0

# RutaEGBB <ruta relativa o absoluta donde están los archivos de finales>
RutaEGBB egbb/

# CacheEGBB N, donde N es el tamaño en MB de la caché usada por la librería de Nalimov
CacheEGBB 32
