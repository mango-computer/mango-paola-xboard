
#*********** Tabla hash ****************

# UsarTablaHash
# Activa o desactiva el uso de la tabla hash.
# El valor (1) activa el uso de la tabla hash.
# El valor (0) desactiva el uso de la tabla hash.
UsarTablaHash 1

# TamanioTablaHash
# Asigna el tamaño de la llave hash.
# El valor (1) asigna una llave hash de 18 bits = 262.143    posiciones por (24 bytes del registro de tabla hash): un total de (    6 MB)
# El valor (2) asigna una llave hash de 19 bits = 524.287    posiciones por (24 bytes del registro de tabla hash): un total de (   12 MB)
# El valor (3) asigna una llave hash de 20 bits = 1.048.575  posiciones por (24 bytes del registro de tabla hash): un total de (   24 MB)
# El valor (4) asigna una llave hash de 21 bits = 2.097.151  posiciones por (24 bytes del registro de tabla hash): un total de (   48 MB)
# El valor (5) asigna una llave hash de 22 bits = 4.194.303  posiciones por (24 bytes del registro de tabla hash): un total de (   96 MB)
# El valor (6) asigna una llave hash de 23 bits = 8.388.607  posiciones por (24 bytes del registro de tabla hash): un total de (  192 MB)
# El valor (7) asigna una llave hash de 24 bits = 16.777.215 posiciones por (24 bytes del registro de tabla hash): un total de (  384 MB)
# El valor (8) asigna una llave hash de 25 bits = 33.554.431 posiciones por (24 bytes del registro de tabla hash): un total de (  768 MB)
# El valor (9) asigna una llave hash de 26 bits = 67.108.863 posiciones por (24 bytes del registro de tabla hash): un total de ( 1536 MB)
#
# Cualquier otro valor se toma como 5: una tabla hash de 96 MB.
#
# Mango AC Ajedrez permite al usuario modificar el tamaño de la llave hash, pero no el espacio que esa llave requiere.
# Cambiar ese espacio sería un desperdicio o un sacrificio de memoria.
# Ejemplo: si el sistema usa una llave de 22 bits, puede asignar hasta 4.194.303 posiciones. Como
# cada posición ocupa 24 bytes, el total es de 96 MB (casi 96 MB; en realidad son 95,999977112 MB). Por eso,
# asignar, por ejemplo, 128 MB no daría más posiciones al motor, porque seguiría trabajando con una llave de 22 bits,
# mientras que una llave de 23 bits necesitaría 192 MB para aprovechar el espacio completo. Internamente se pudo incorporar código para
# manejar llaves mayores que el espacio asignado. Ejemplo: se podría trabajar con una llave de 23 bits (8.388.607 posiciones),
# cuyo espacio necesario sería 192 MB, aunque el usuario asignara 128 MB. Ese espacio supera la llave de 22 bits,
# pero no alcanza para una de 23 bits.
# La solución sería añadir varias comprobaciones, trabajar con la llave que supera el espacio y, cada vez
# que el hash dé una dirección fuera del espacio reservado, descartarla o reasignarla a una segunda tabla, u otras
# opciones. Sea cual sea la solución, añadiría más líneas de código y más ciclos de CPU, y por tanto
# menos nodos recorridos. Pensando en ello y en la velocidad del motor, se eligió la forma de trabajo actual.
# Si compiten dos motores y se requiere que ambos tengan, en teoría, la misma cantidad de memoria para la tabla hash,
# asigne a Mango AC el tamaño inmediatamente inferior. Ejemplo: el motor X contra Mango AC; al motor X se le asignan 128 MB;
# entonces a Mango AC se le asigna una llave de 22 bits, que son 96 MB.
TamanioTablaHash 5

#**************** Libro de aperturas ********************
# UsarLibroAperturas
# Activa o desactiva el uso del libro de aperturas.
# El valor (1) activa el uso del libro de aperturas.
# El valor (0) desactiva el uso del libro de aperturas.
UsarLibroAperturas 1

# RutaRandom <ruta relativa o absoluta donde están los archivos random1.bin y random2.bin,
# necesarios para los números aleatorios de los libros>
RutaRandom1 libros/random1.bin
RutaRandom2 libros/random2.bin

# RutaMainBook <ruta relativa o absoluta donde está el archivo mainbook.bin>
RutaMainBook libros/mainbook.bin

# RutaTourBook <ruta relativa o absoluta donde está el archivo tourbook.bin>
RutaTourBook libros/tourbook.bin

#**************** Base de datos de finales ********************
